<script>
        // Image comparison slider logic
        const slider = document.getElementById('compare-slider');
        const beforeImg = document.getElementById('before-image-container');
        const afterImg = document.getElementById('after-image-container');
        const sliderLine = document.getElementById('slider-line');
        const sliderHandle = document.getElementById('slider-handle');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            
            // Update clips
            beforeImg.style.clipPath = `polygon(0 0, ${val}% 0, ${val}% 100%, 0 100%)`;
            afterImg.style.clipPath = `polygon(${val}% 0, 100% 0, 100% 100%, ${val}% 100%)`;
            
            // Update UI elements
            sliderLine.style.left = `${val}%`;
            sliderHandle.style.left = `${val}%`;
        });
    </script>
