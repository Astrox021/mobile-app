<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CreatorFlow - Select Platforms</title>

                        "on-secondary-container": "#5c647a",
                        "inverse-primary": "#c0c1ff",
                        "on-surface": "#191c1e",

                        "surface-bright": "#f7f9fb",

                        "surface-dim": "#d8dadc",

                    "spacing": {

                    "fontFamily": {

<style>
        /* Custom toggle styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #6366F1;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #6366F1;
        }
        .toggle-checkbox:checked + .toggle-label::after {
            transform: translateX(100%);
            border-color: white;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0px 15px 35px rgba(15, 23, 42, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Linear/Transactional Page: Shell Suppressed -->
<!-- Header / Stepper Area -->
<header class="w-full px-margin-mobile pt-stack-lg pb-stack-md flex flex-col gap-stack-md z-10 sticky top-0 bg-background/90 backdrop-blur-md">
<div class="flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:scale-95 text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Step 2 of 3</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
<div class="space-y-stack-sm text-center px-4">
<h1 class="font-headline-md text-headline-md text-on-background">Select Platforms</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose where you want to publish your content. We'll optimize the format for each.</p>
</div>
<!-- Progress Bar -->
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden mt-stack-sm">
<div class="h-full bg-primary w-2/3 rounded-full transition-all duration-500 ease-in-out"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile py-stack-md flex flex-col gap-stack-md pb-32">
<!-- Platform Cards -->
<div class="flex flex-col gap-gutter">
<!-- LinkedIn -->
<label class="group relative flex items-center p-5 bg-surface-container-lowest rounded-[24px] cursor-pointer transition-all duration-300 card-hover shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-surface-variant focus-within:border-primary">
<div class="w-12 h-12 rounded-xl bg-[#0A66C2]/10 flex items-center justify-center text-[#0A66C2] mr-4 flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-background mb-1">LinkedIn</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Professional Network • Article &amp; Post</p>
</div>
<div class="ml-4">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 top-0 left-0 transition-transform duration-300 checked:translate-x-full checked:border-primary" id="toggle_linkedin" name="platform" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300" for="toggle_linkedin"></label>
</div>
</div>
</label>
<!-- Instagram -->
<label class="group relative flex items-center p-5 bg-surface-container-lowest rounded-[24px] cursor-pointer transition-all duration-300 card-hover shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-surface-variant focus-within:border-primary">
<div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] flex items-center justify-center text-white mr-4 flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-background mb-1">Instagram</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Visual Feed • Square/Reel</p>
</div>
<div class="ml-4">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 top-0 left-0 transition-transform duration-300 checked:translate-x-full checked:border-primary" id="toggle_instagram" name="platform" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer transition-colors duration-300" for="toggle_instagram"></label>
</div>
</div>
</label>
<!-- X (Twitter) -->
<label class="group relative flex items-center p-5 bg-surface-container-lowest rounded-[24px] cursor-pointer transition-all duration-300 card-hover shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-surface-variant focus-within:border-primary">
<div class="w-12 h-12 rounded-xl bg-black flex items-center justify-center text-white mr-4 flex-shrink-0">
<span class="font-display-lg text-[24px] leading-none">X</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-background mb-1">X</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Microblogging • Thread &amp; Media</p>
</div>
<div class="ml-4">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 top-0 left-0 transition-transform duration-300 checked:translate-x-full checked:border-primary" id="toggle_x" name="platform" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300" for="toggle_x"></label>
</div>
</div>
</label>
<!-- Reddit -->
<label class="group relative flex items-center p-5 bg-surface-container-lowest rounded-[24px] cursor-pointer transition-all duration-300 card-hover shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-surface-variant focus-within:border-primary">
<div class="w-12 h-12 rounded-xl bg-[#FF4500]/10 flex items-center justify-center text-[#FF4500] mr-4 flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">forum</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-background mb-1">Reddit</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Community Forums • Text &amp; Link</p>
</div>
<div class="ml-4">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-variant appearance-none cursor-pointer z-10 top-0 left-0 transition-transform duration-300 checked:translate-x-full checked:border-primary" id="toggle_reddit" name="platform" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300" for="toggle_reddit"></label>
</div>
</div>
</label>
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB area for transactional flow) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile pb-[max(20px,env(safe-area-inset-bottom))] bg-surface/80 backdrop-blur-xl border-t border-white/20 z-50">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 py-4 px-6 rounded-[16px] bg-[#6366F1] text-white font-headline-sm text-headline-sm text-center active:scale-[0.98] transition-transform duration-200 flex justify-center items-center shadow-md">
                Continue
            </button>
</div>
</div>
<script>
        // Simple logic to ensure checkboxes and visual toggles stay in sync visually if clicked programmatically, 
        // though CSS handles the hover/checked states mainly.
        document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const labelContainer = this.closest('label.group');
                if(this.checked) {
                    labelContainer.classList.add('border-primary', 'bg-surface-lowest');
                } else {
                    labelContainer.classList.remove('border-primary');
                }
            });
            // Initialize state
            if(checkbox.checked) {
                checkbox.closest('label.group').classList.add('border-primary');
            }
        });
    </script>
</body></html>
