<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar from JSON -->
<!-- Content: Edit Caption (Translating Intent to Header) -->
<header class="fixed top-0 w-full z-50 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-3xl shadow-sm border-b border-white/10 dark:border-white/5">
<div class="flex items-center justify-between px-margin-mobile py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim">Edit Caption</h1>
</div>
<!-- Notifications icon kept from JSON, but secondary to the back action for this screen -->
<button class="active:scale-95 transition-transform duration-200 text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile flex flex-col gap-section-gap">
<!-- Editable Caption Area -->
<section class="flex flex-col gap-stack-sm">
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0px_10px_30px_rgba(15,23,42,0.04)] relative">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-body-lg font-body-lg text-on-surface resize-none h-32" placeholder="Write a caption...">Just launched the new dashboard! 🚀 #UXDesign #CreatorFlow</textarea>
<div class="absolute bottom-4 right-5 text-on-surface-variant font-label-caps text-label-caps opacity-60">
                    61 / 2200
                </div>
</div>
</section>
<!-- AI Tone Selection -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Tone</h2>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-label-caps text-label-caps active:scale-95 transition-transform">
                    Professional
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps active:scale-95 transition-transform hover:bg-surface-variant">
                    Witty
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps active:scale-95 transition-transform hover:bg-surface-variant">
                    Hype
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps active:scale-95 transition-transform hover:bg-surface-variant">
                    Minimal
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps active:scale-95 transition-transform hover:bg-surface-variant">
                    Storyteller
                </button>
</div>
</section>
<!-- AI Actions Bento -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
                AI Actions
            </h2>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-surface-container-lowest shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-primary-fixed-dim hover:bg-surface-bright transition-all active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="short_text">short_text</span>
<span class="font-body-md text-body-md text-on-surface">Shorten</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-surface-container-lowest shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-primary-fixed-dim hover:bg-surface-bright transition-all active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="add_reaction">add_reaction</span>
<span class="font-body-md text-body-md text-on-surface">Add Emojis</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-surface-container-lowest shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-primary-fixed-dim hover:bg-surface-bright transition-all active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="bolt">bolt</span>
<span class="font-body-md text-body-md text-on-surface">Make it Punchy</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-surface-container-lowest shadow-[0px_10px_30px_rgba(15,23,42,0.04)] border border-transparent hover:border-primary-fixed-dim hover:bg-surface-bright transition-all active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="magic_button">magic_button</span>
<span class="font-body-md text-body-md text-on-surface text-center">Alternatives</span>
</button>
</div>
</section>
<!-- Action Buttons Area -->
<div class="flex flex-col gap-3 mt-4">
<button class="w-full bg-primary text-on-primary py-4 rounded-2xl font-headline-sm text-headline-sm active:scale-95 transition-transform duration-200">
                Apply Changes
            </button>
<button class="w-full bg-transparent text-primary py-4 rounded-2xl font-headline-sm text-headline-sm active:scale-95 transition-transform duration-200 border border-outline-variant hover:bg-surface-variant">
                Cancel
            </button>
</div>
</main>
<!-- BottomNavBar from JSON (Drafts is Active) -->
<!-- Note: While a purely transactional screen might hide the nav, editing a draft sits conceptually within 'Drafts' in the hierarchy requested by the user prompt. We follow the JSON shell mandate while suppressing it if strictly 'dead end'. Given prompt instruction: "Navigation: BottomNavBar with 'Drafts' active.", we render it. -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-3xl shadow-[0px_-10px_30px_rgba(15,23,42,0.04)] border-t border-white/10 dark:border-white/5">
<div class="flex justify-around items-center h-16 px-margin-mobile w-full">
<!-- Home: Inactive -->
<button class="flex flex-col items-center gap-1 text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<!-- Drafts: Active (Matches JSON instruction) -->
<button class="flex flex-col items-center gap-1 text-primary dark:text-primary-fixed-dim font-bold hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200">
<div data-weight="fill">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
</div>
<span class="font-label-caps text-label-caps">Drafts</span>
</button>
<!-- History: Inactive -->
<button class="flex flex-col items-center gap-1 text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-caps text-label-caps">History</span>
</button>
<!-- Profile: Inactive -->
<button class="flex flex-col items-center gap-1 text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</div>
</nav>
